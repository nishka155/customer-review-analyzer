# ---------------------------------------------------------------------------
# Customer Review Analyzer - runtime configuration
# Secrets (the API key) are NOT stored here; they are read from the
# GEMINI_API_KEY environment variable or a local .env file.
# ---------------------------------------------------------------------------

llm:
  provider: gemini
  model: gemini-2.5-flash          # any Gemini model id, e.g. gemini-2.5-flash-lite / gemini-2.5-pro
  temperature: 0.2                 # low = consistent, reproducible labels
  qa_temperature: 0.4              # a little more fluent for free-text answers
  max_output_tokens: 8192
  thinking_budget: 0               # 0 disables "thinking" on 2.5 Flash (faster + cheaper); null = model default
  max_retries: 4                   # retries on 429 / 5xx / malformed JSON
  retry_base_delay: 2.0            # seconds, exponential backoff: 2, 4, 8, 16 (+ jitter)

analysis:
  batch_size: 10                   # reviews per API call - batching cuts calls ~10x
  max_workers: 4                   # parallel batch requests (keep low on the free tier)
  max_review_chars: 1500           # longer reviews are truncated to save tokens
  min_review_chars: 3
  max_reviews: 500                 # hard cap per run
  # Canonical aspects the model maps opinions onto (keeps charts consistent).
  aspects:
    - product quality
    - price / value
    - delivery / shipping
    - customer service
    - ease of use
    - packaging
    - battery / performance
    - design / comfort
  allow_new_aspects: true          # model may add an aspect not in the list when clearly needed

synthesis:
  max_quotes_per_polarity: 25      # representative quotes sent to the insight step

qa:
  top_k_reviews: 25                # reviews retrieved as grounding context per question

cache:
  enabled: true                    # identical requests are served from disk - no repeat cost
  directory: .cache

paths:
  prompts: prompts/prompts.yaml
  sample_data: data/sample_reviews.csv
